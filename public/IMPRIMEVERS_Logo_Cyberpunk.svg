<svg id="master-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" class="w-full h-full drop-shadow-2xl">
              <defs>
                <!-- Neon Gradients -->
                <linearGradient id="purpleToBlue" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#bf00ff"/>
                  <stop offset="100%" stop-color="#00e5ff"/>
                </linearGradient>

                <linearGradient id="blueToRed" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#00e5ff"/>
                  <stop offset="100%" stop-color="#ff0055"/>
                </linearGradient>

                <linearGradient id="redToPurple" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ff0055"/>
                  <stop offset="100%" stop-color="#9d00ff"/>
                </linearGradient>

                <linearGradient id="nozzleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#1e1e38"/>
                  <stop offset="50%" stop-color="#0f0f1d"/>
                  <stop offset="100%" stop-color="#05050a"/>
                </linearGradient>

                <!-- Glow Filter -->
                <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
                  <feGaussianBlur stdDeviation="10" result="blur"/>
                  <feMerge>
                    <feMergeNode in="blur"/>
                    <feMergeNode in="SourceGraphic"/>
                  </feMerge>
                </filter>
              </defs>

              <!-- Isometric Outer Frame Shield -->
              <g class="logo-glow-element" filter="url(#neonGlow)">
                <!-- Outer Hexagon Frame -->
                <polygon points="400,60 680,220 680,580 400,740 120,580 120,220" fill="none" stroke="url(#purpleToBlue)" stroke-width="8" opacity="0.9"/>
                
                <!-- Inner Hex Shield Lines -->
                <polygon points="400,95 650,240 650,560 400,705 150,560 150,240" fill="none" stroke="#ff0055" stroke-width="2" stroke-dasharray="12 8" opacity="0.6"/>
              </g>

              <!-- Circuit Node Accents -->
              <g stroke="url(#blueToRed)" stroke-width="3" fill="none" opacity="0.7">
                <path d="M 120,220 L 200,220 L 250,270"/>
                <circle cx="250" cy="270" r="5" fill="#00e5ff"/>

                <path d="M 680,220 L 600,220 L 550,270"/>
                <circle cx="550" cy="270" r="5" fill="#ff0055"/>

                <path d="M 400,740 L 400,660 L 450,610"/>
                <circle cx="450" cy="610" r="5" fill="#bf00ff"/>
              </g>

              <!-- Central Monogram Monolith 'I' and 'V' + 3D Nozzle Concept -->
              <g transform="translate(0, -10)">
                <!-- 3D Extruder Nozzle Top Geometry -->
                <g class="logo-glow-element">
                  <!-- Extruder Block Base -->
                  <polygon points="320,160 480,160 520,220 280,220" fill="url(#nozzleGrad)" stroke="#00e5ff" stroke-width="4"/>
                  <!-- Heat Block -->
                  <polygon points="350,220 450,220 430,270 370,270" fill="#121220" stroke="#bf00ff" stroke-width="3"/>
                  <!-- Brass Nozzle Tip -->
                  <polygon points="380,270 420,270 400,305" fill="#ff0055"/>
                  
                  <!-- Hot Filament Layer Line Beam Extrusion -->
                  <line x1="400" y1="305" x2="400" y2="380" stroke="#00e5ff" stroke-width="8" stroke-linecap="round" filter="url(#neonGlow)"/>
                </g>

                <!-- Stylized Monogram "I" & "V" Interlocking Layer Lines -->
                <!-- The "I" Center Pillar -->
                <path d="M 400,380 L 400,600" stroke="url(#purpleToBlue)" stroke-width="28" stroke-linecap="round" filter="url(#neonGlow)"/>
                <path d="M 400,380 L 400,600" stroke="#ffffff" stroke-width="8" stroke-linecap="round" opacity="0.9"/>

                <!-- The "V" Wings Outer Extrusions -->
                <!-- Left Wing of V -->
                <path d="M 260,370 L 370,580 L 400,600" fill="none" stroke="url(#redToPurple)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
                <path d="M 260,370 L 370,580 L 400,600" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

                <!-- Right Wing of V -->
                <path d="M 540,370 L 430,580 L 400,600" fill="none" stroke="url(#blueToRed)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>
                <path d="M 540,370 L 430,580 L 400,600" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>

                <!-- 3D Print Layer Slice Marks across Monogram -->
                <g stroke="#0a0a12" stroke-width="3" opacity="0.6">
                  <line x1="240" y1="420" x2="560" y2="420"/>
                  <line x1="260" y1="460" x2="540" y2="460"/>
                  <line x1="280" y1="500" x2="520" y2="500"/>
                  <line x1="300" y1="540" x2="500" y2="540"/>
                </g>
              </g>

              <!-- Brand Name Typography inside Logo -->
              <text x="400" y="670" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="8" filter="url(#neonGlow)">
                IMPRIMEVERS
              </text>
              <text x="400" y="700" text-anchor="middle" font-family="'Orbitron', sans-serif" font-size="14" font-weight="700" fill="#00e5ff" letter-spacing="4">
                3D PRINT LAB
              </text>
            </svg>