<svg id="master-banner-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" class="w-full h-full">
            <defs>
              <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#07070e"/>
                <stop offset="50%" stop-color="#121224"/>
                <stop offset="100%" stop-color="#0a0a14"/>
              </linearGradient>

              <!-- Futuristic Grid Pattern -->
              <pattern id="bannerGrid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00e5ff" stroke-width="0.8" opacity="0.15"/>
              </pattern>

              <!-- Radial Horizon Glow -->
              <radialGradient id="horizonGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#bf00ff" stop-opacity="0.4"/>
                <stop offset="60%" stop-color="#ff0055" stop-opacity="0.15"/>
                <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
              </radialGradient>

              <filter id="glowBanner" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="8" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <!-- Background Base -->
            <rect width="1200" height="630" fill="url(#bannerBg)"/>
            <rect width="1200" height="630" fill="url(#bannerGrid)"/>

            <!-- Perspective Cyber Grid Horizon at Bottom -->
            <g opacity="0.4">
              <!-- Perspective lines converging to center horizon -->
              <line x1="600" y1="315" x2="-200" y2="630" stroke="#00e5ff" stroke-width="2"/>
              <line x1="600" y1="315" x2="100" y2="630" stroke="#00e5ff" stroke-width="2"/>
              <line x1="600" y1="315" x2="400" y2="630" stroke="#00e5ff" stroke-width="2"/>
              <line x1="600" y1="315" x2="600" y2="630" stroke="#00e5ff" stroke-width="2"/>
              <line x1="600" y1="315" x2="800" y2="630" stroke="#00e5ff" stroke-width="2"/>
              <line x1="600" y1="315" x2="1100" y2="630" stroke="#00e5ff" stroke-width="2"/>
              <line x1="600" y1="315" x2="1400" y2="630" stroke="#00e5ff" stroke-width="2"/>
              
              <!-- Horizontal Grid Lines -->
              <line x1="0" y1="380" x2="1200" y2="380" stroke="#bf00ff" stroke-width="1.5"/>
              <line x1="0" y1="430" x2="1200" y2="430" stroke="#bf00ff" stroke-width="2"/>
              <line x1="0" y1="500" x2="1200" y2="500" stroke="#bf00ff" stroke-width="2.5"/>
              <line x1="0" y1="580" x2="1200" y2="580" stroke="#bf00ff" stroke-width="3"/>
            </g>

            <!-- Center Central Horizon Glow -->
            <circle cx="600" cy="315" r="350" fill="url(#horizonGlow)"/>

            <!-- Neon Digital Filament Line Waves (3D Printing Line Graphic) -->
            <path d="M -50 250 Q 300 100 600 315 T 1250 400" fill="none" stroke="#00e5ff" stroke-width="4" filter="url(#glowBanner)" opacity="0.8"/>
            <path d="M -50 380 Q 350 500 600 315 T 1250 200" fill="none" stroke="#ff0055" stroke-width="4" filter="url(#glowBanner)" opacity="0.8"/>
            <path d="M -50 300 Q 450 200 600 315 T 1250 300" fill="none" stroke="#bf00ff" stroke-width="5" filter="url(#glowBanner)"/>

            <!-- Cyber HUD Framing Corners -->
            <g stroke="#00e5ff" stroke-width="3" fill="none" opacity="0.8">
              <!-- Top Left -->
              <path d="M 30 70 L 30 30 L 70 30"/>
              <circle cx="30" cy="30" r="3" fill="#00e5ff"/>
              
              <!-- Top Right -->
              <path d="M 1130 30 L 1170 30 L 1170 70"/>
              <circle cx="1170" cy="30" r="3" fill="#ff0055"/>

              <!-- Bottom Left -->
              <path d="M 30 560 L 30 600 L 70 600"/>
              <circle cx="30" cy="600" r="3" fill="#bf00ff"/>

              <!-- Bottom Right -->
              <path d="M 1170 560 L 1170 600 L 1130 600"/>
              <circle cx="1170" cy="600" r="3" fill="#00e5ff"/>
            </g>

            <!-- HUD Interface Data Callouts -->
            <g font-family="'Orbitron', sans-serif" font-size="11" fill="#00e5ff" opacity="0.8">
              <text x="45" y="50">SYS.LOC: [3D_PRINT_LAB]</text>
              <text x="45" y="68">STATUS: ONLINE / READY TO PRINT</text>
              <text x="1000" y="50" text-anchor="end" fill="#ff0055">EXTRUDER_TEMP: 235°C</text>
              <text x="1000" y="68" text-anchor="end" fill="#bf00ff">BED_TEMP: 60°C</text>
            </g>

            <!-- Left Embedded Logo Symbol -->
            <g transform="translate(140, 160) scale(0.42)">
              <polygon points="400,60 680,220 680,580 400,740 120,580 120,220" fill="#121220" stroke="url(#purpleToBlue)" stroke-width="12" filter="url(#glowBanner)"/>
              <path d="M 400,380 L 400,600" stroke="#00e5ff" stroke-width="32" stroke-linecap="round" filter="url(#glowBanner)"/>
              <path d="M 260,370 L 370,580 L 400,600" fill="none" stroke="#ff0055" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowBanner)"/>
              <path d="M 540,370 L 430,580 L 400,600" fill="none" stroke="#bf00ff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowBanner)"/>
              <!-- Nozzle Tip -->
              <polygon points="350,200 450,200 400,270" fill="#00e5ff"/>
              <line x1="400" y1="270" x2="400" y2="380" stroke="#ff0055" stroke-width="10"/>
            </g>

            <!-- Right Main Typography Title & Subtitles -->
            <g transform="translate(480, 240)">
              <!-- Main Brand Title -->
              <text x="0" y="70" font-family="'Orbitron', sans-serif" font-size="72" font-weight="900" fill="#ffffff" letter-spacing="6" filter="url(#glowBanner)">
                IMPRIMEVERS
              </text>
              
              <!-- Neon Stroke Overlay -->
              <text x="0" y="70" font-family="'Orbitron', sans-serif" font-size="72" font-weight="900" fill="none" stroke="#00e5ff" stroke-width="2" letter-spacing="6">
                IMPRIMEVERS
              </text>

              <!-- Tagline & Badge -->
              <rect x="0" y="105" width="380" height="36" rx="6" fill="#bf00ff" opacity="0.2" stroke="#bf00ff" stroke-width="1.5"/>
              <text x="15" y="128" font-family="'Orbitron', sans-serif" font-size="18" font-weight="700" fill="#00e5ff" letter-spacing="4">
                LABORATORIO DE IMPRESIÓN 3D
              </text>

              <!-- Founders Subtitle Tag -->
              <g transform="translate(0, 175)">
                <text x="0" y="0" font-family="'Orbitron', sans-serif" font-size="16" font-weight="600" fill="#e2e8f0" letter-spacing="2">
                  PILOTOS: <tspan fill="#bf00ff">MALVAVYSCO</tspan> <tspan fill="#00e5ff">×</tspan> <tspan fill="#ff0055">BOBONSAM</tspan>
                </text>
              </g>

              <!-- Feature Bullet Badges -->
              <g transform="translate(0, 215)" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
                <rect x="0" y="0" width="130" height="26" rx="13" fill="#1e1e30" stroke="#00e5ff" stroke-width="1"/>
                <text x="65" y="17" text-anchor="middle" fill="#00e5ff">FDM &amp; RESIN</text>

                <rect x="145" y="0" width="140" height="26" rx="13" fill="#1e1e30" stroke="#ff0055" stroke-width="1"/>
                <text x="215" y="17" text-anchor="middle" fill="#ff0055">CUSTOM PROTOS</text>

                <rect x="295" y="0" width="130" height="26" rx="13" fill="#1e1e30" stroke="#bf00ff" stroke-width="1"/>
                <text x="360" y="17" text-anchor="middle" fill="#bf00ff">CYBER ART</text>
              </g>
            </g>

            <!-- Decorative Digital Noise / Dots -->
            <circle cx="1100" cy="200" r="2" fill="#00e5ff"/>
            <circle cx="1080" cy="240" r="3" fill="#ff0055"/>
            <circle cx="1130" cy="280" r="1.5" fill="#bf00ff"/>
          </svg>